services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports: ["3306:3306"]
  eureka:
    build: { context: ., args: { SERVICE: eureka-server } }
    ports: ["8761:8761"]
  auth:
    build: { context: ., args: { SERVICE: auth-service } }
    environment: { EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/", SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/logifleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC", SPRING_DATASOURCE_USERNAME: root, SPRING_DATASOURCE_PASSWORD: root }
    depends_on: [eureka, mysql]
    ports: ["8081:8081"]
  vehicle:
    build: { context: ., args: { SERVICE: vehicle-service } }
    environment: { EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/", SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/logifleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC", SPRING_DATASOURCE_USERNAME: root, SPRING_DATASOURCE_PASSWORD: root }
    depends_on: [eureka, mysql]
    ports: ["8082:8082"]
  maintenance:
    build: { context: ., args: { SERVICE: maintenance-service } }
    environment: { EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/", SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/logifleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC", SPRING_DATASOURCE_USERNAME: root, SPRING_DATASOURCE_PASSWORD: root }
    depends_on: [eureka, mysql]
    ports: ["8083:8083"]
  trip:
    build: { context: ., args: { SERVICE: trip-service } }
    environment: { EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/", SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/logifleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC", SPRING_DATASOURCE_USERNAME: root, SPRING_DATASOURCE_PASSWORD: root }
    depends_on: [eureka, vehicle, maintenance, mysql]
    ports: ["8084:8084"]
  gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    environment: { EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/ }
    depends_on: [eureka, auth, vehicle, maintenance, trip]
    ports: ["8080:8080"]
volumes:
  mysql-data:
