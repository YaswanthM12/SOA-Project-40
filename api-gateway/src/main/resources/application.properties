server.port=8080
spring.application.name=api-gateway
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].id=vehicle-service
spring.cloud.gateway.routes[1].uri=lb://vehicle-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/vehicles/**
spring.cloud.gateway.routes[2].id=trip-service
spring.cloud.gateway.routes[2].uri=lb://trip-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/trips/**
spring.cloud.gateway.routes[3].id=maintenance-service
spring.cloud.gateway.routes[3].uri=lb://maintenance-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/maintenance/**
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
app.jwt.secret=logifleet-class-project-secret-key-must-have-32-characters
